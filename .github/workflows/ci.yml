name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests with coverage
        run: pytest

      - name: Validate pipeline definition
        run: dvc dag

      - name: Run pipeline on generated data
        run: |
          python -m src.pipeline.synthetic --out data/synthetic/raw_data.txt
          python -m src.pipeline.clean --params params.ci.yaml
          python -m src.pipeline.prepare --params params.ci.yaml
          python -m src.pipeline.train --params params.ci.yaml
          python -m src.pipeline.evaluate --params params.ci.yaml

      - name: Check metric gates
        run: python -m src.pipeline.check_metrics --params params.ci.yaml

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-reports
          path: data/synthetic/reports
